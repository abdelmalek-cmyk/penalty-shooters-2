<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="ball-clip">
      <circle cx="64" cy="64" r="57"/>
    </clipPath>
  </defs>

  <!-- Ball body -->
  <circle cx="64" cy="64" r="57" fill="#ffffff" stroke="#111111" stroke-width="4"/>

  <!-- Classic football pentagon patches, clipped to ball circle -->
  <g clip-path="url(#ball-clip)" fill="#111111">
    <!-- Top pentagon (center) -->
    <polygon points="64,13 78,23 73,40 55,40 50,23"/>
    <!-- Upper-right pentagon -->
    <polygon points="91,32 105,42 100,59 82,59 77,42"/>
    <!-- Lower-right pentagon -->
    <polygon points="83,76 97,86 92,103 74,103 69,86"/>
    <!-- Bottom pentagon -->
    <polygon points="64,89 78,99 73,116 55,116 50,99"/>
    <!-- Lower-left pentagon -->
    <polygon points="45,76 59,86 54,103 36,103 31,86"/>
    <!-- Upper-left pentagon -->
    <polygon points="37,32 51,42 46,59 28,59 23,42"/>
  </g>

  <!-- Ball border on top -->
  <circle cx="64" cy="64" r="57" fill="none" stroke="#111111" stroke-width="4"/>
</svg>
